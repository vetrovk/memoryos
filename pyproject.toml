[project]
name = "memoryos-local"
version = "0.5.0"
description = "Local-first engineering memory for coding agents and developers."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0; python_version >= '3.10'"]

[project.scripts]
memory = "memoryos.cli:main"

[tool.setuptools]
packages = ["memoryos"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
